<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Winamp Radio</title>
<style>
:root { --lcd:#001a4d; --lcd-text:#00e5ff; --bg:#0c0c14; --accent:#ff9800; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:system-ui,-apple-system,sans-serif; background:#111; color:#eee; min-height:100vh; display:flex; justify-content:center; }
.app { width:100%; max-width:420px; height:100vh; max-height:900px; background:#000; position:relative; display:flex; flex-direction:column; }
.status { height:env(safe-area-inset-top,44px); min-height:44px; background:#000; display:flex; justify-content:space-between; align-items:center; padding:0 16px; font-size:14px; font-weight:600; color:#fff; }
.content { flex:1; overflow-y:auto; background:var(--bg); padding-bottom:70px; }
.winamp { margin:12px; background:linear-gradient(180deg,#e8e8e8,#b0b0b0); border:3px solid #666; border-radius:10px; overflow:hidden; }
.lcd { background:var(--lcd); color:var(--lcd-text); font-family:"Courier New",monospace; padding:18px 14px; text-align:center; min-height:160px; }
.lcd .live { font-size:12px; letter-spacing:2px; opacity:.8; }
.lcd .title { font-size:26px; font-weight:bold; letter-spacing:1px; margin:6px 0; text-shadow:0 0 10px var(--lcd-text); }
.lcd .sub { font-size:13px; opacity:.85; }
.spectrum { height:36px; display:flex; align-items:flex-end; justify-content:center; gap:3px; margin-top:12px; }
.bar { width:5px; background:var(--lcd-text); border-radius:1px; animation:bounce .7s infinite alternate; }
@keyframes bounce { to { transform:scaleY(.4); opacity:.5; } }
.controls { display:flex; justify-content:center; align-items:center; gap:10px; padding:14px; background:#d4d4d4; }
.btn { width:52px; height:52px; background:linear-gradient(#fff,#ccc); border:2px solid #888; border-radius:8px; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
.btn.share { background:linear-gradient(#ffb74d,#f57c00); color:#fff; font-weight:bold; width:auto; padding:0 16px; font-size:15px; }
.btn:active { transform:scale(.94); }
.nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:420px; height:70px; background:#111; border-top:1px solid #333; display:flex; justify-content:space-around; align-items:center; padding-bottom:env(safe-area-inset-bottom); }
.nav button { background:none; border:none; color:#888; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
.nav button.active { color:var(--lcd-text); }
.globe-wrap { height:380px; background:radial-gradient(circle at center,#1a3a6e 0%,#050510 70%); display:flex; align-items:center; justify-content:center; position:relative; }
.globe { width:260px; height:260px; border-radius:50%; background:#0a2a4a; position:relative; box-shadow:inset -20px -20px 40px rgba(0,0,0,.5),0 0 40px rgba(0,200,255,.25); overflow:hidden; }
.dot { position:absolute; width:10px; height:10px; background:#00ff66; border-radius:50%; box-shadow:0 0 8px #00ff66; cursor:pointer; }
.list { padding:8px 12px; }
.item { background:#1a1a28; margin:6px 0; padding:12px 14px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; border-left:3px solid transparent; }
.item:hover,.item.active { border-left-color:var(--lcd-text); background:#222236; }
.item .name { font-weight:600; }
.item .info { font-size:12px; color:#aaa; margin-top:2px; }
.section-title { padding:14px 16px 6px; color:var(--lcd-text); font-size:13px; font-weight:bold; letter-spacing:1px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal.show { display:flex; }
.modal-box { background:#1a1a28; width:90%; max-width:340px; border-radius:16px; padding:20px; border:1px solid #444; }
.modal-box h3 { margin-bottom:12px; color:var(--lcd-text); }
.share-opt { padding:14px; margin:6px 0; background:#2a2a3a; border-radius:8px; cursor:pointer; text-align:center; }
.share-opt:active { background:#333; }
audio { display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="status">
    <span id="clock">14:32</span>
    <span>Winamp Radio</span>
    <span id="status">●</span>
  </div>
  <div class="content" id="content"></div>
  <div class="nav">
    <button id="tab-player" onclick="show('player')" class="active">▶<br>Prehrávač</button>
    <button id="tab-radio" onclick="show('radio')">🌍<br>Rádio</button>
    <button id="tab-library" onclick="show('library')">📁<br>Knižnica</button>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<div class="modal" id="shareModal">
  <div class="modal-box">
    <h3>Zdieľať aktuálne vysielanie</h3>
    <div id="shareText" style="margin-bottom:16px;color:#ccc;font-size:14px;"></div>
    <div class="share-opt" onclick="doShare('native')">Zdieľať (systémové)</div>
    <div class="share-opt" onclick="doShare('copy')">Kopírovať odkaz</div>
    <div class="share-opt" onclick="doShare('whatsapp')">WhatsApp</div>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn" style="width:auto;padding:0 24px;" onclick="closeShare()">Zavrieť</button>
    </div>
  </div>
</div>
<script>
const stations = [
  {id:1, name:"Fun Radio", city:"Bratislava", country:"Slovakia", freq:"94.3 FM", genre:"Pop", url:"http://stream.funradio.sk:8000/fun128.mp3"},
  {id:2, name:"SomaFM Groove Salad", city:"San Francisco", country:"USA", freq:"Online", genre:"Ambient", url:"https://ice5.somafm.com/groovesalad-128-mp3"},
  {id:3, name:"SomaFM Drone Zone", city:"San Francisco", country:"USA", freq:"Online", genre:"Ambient", url:"https://ice5.somafm.com/dronezone-128-mp3"},
  {id:4, name:"Radio Paradise", city:"California", country:"USA", freq:"Online", genre:"Eclectic", url:"https://stream.radioparadise.com/aac-128"},
  {id:5, name:"SomaFM Indie Pop", city:"San Francisco", country:"USA", freq:"Online", genre:"Indie", url:"https://ice5.somafm.com/indiepop-128-mp3"},
  {id:6, name:"SomaFM Deep Space One", city:"San Francisco", country:"USA", freq:"Online", genre:"Ambient", url:"https://ice5.somafm.com/deepspaceone-128-mp3"},
  {id:7, name:"Radio Expres", city:"Bratislava", country:"Slovakia", freq:"107.6 FM", genre:"Pop", url:"https://stream.expres.sk/128.mp3"},
  {id:8, name:"BBC World Service", city:"London", country:"UK", freq:"Online", genre:"News", url:"https://stream.live.vc.bbcmedia.co.uk/bbc_world_service"}
];

const savedSongs = [
  {title:"Smells Like Teen Spirit", artist:"Nirvana", album:"Nevermind"},
  {title:"Wonderwall", artist:"Oasis", album:"Morning Glory"},
  {title:"Clocks", artist:"Coldplay", album:"A Rush of Blood to the Head"}
];

let current = stations[1];
let recent = JSON.parse(localStorage.getItem('wr_recent') || '[]');
let playing = false;
const audio = document.getElementById('audio');

function saveRecent() {
  if (!recent.find(r => r.id === current.id)) {
    recent.unshift({...current, time: Date.now()});
    recent = recent.slice(0, 8);
    localStorage.setItem('wr_recent', JSON.stringify(recent));
  }
}

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateClock, 10000);
updateClock();

function setStatus(txt) { document.getElementById('status').textContent = txt; }

function playStation(st) {
  current = st;
  saveRecent();
  audio.src = st.url;
  audio.play().then(() => {
    playing = true;
    setStatus('● LIVE');
  }).catch(err => {
    setStatus('⚠ chyba');
    console.warn(err);
    alert('Stream sa nepodarilo spustiť. Skús inú stanicu.');
  });
  show('player');
}

function show(tab) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const c = document.getElementById('content');
  if (tab === 'player') c.innerHTML = renderPlayer();
  if (tab === 'radio') { c.innerHTML = renderRadio(); setTimeout(placeDots, 50); }
  if (tab === 'library') c.innerHTML = renderLibrary();
  if (tab === 'player') setTimeout(initSpectrum, 50);
}

function renderPlayer() {
  return `
    <div class="winamp">
      <div class="lcd">
        <div class="live">${playing ? '● LIVE' : '○ STOP'}</div>
        <div class="title">${current.name}</div>
        <div class="sub">${current.city}, ${current.country}<br>${current.freq} • ${current.genre}</div>
        <div class="spectrum" id="spectrum"></div>
      </div>
      <div class="controls">
        <div class="btn" onclick="prev()">⏮</div>
        <div class="btn" onclick="toggle()">${playing ? '⏸' : '▶'}</div>
        <div class="btn" onclick="next()">⏭</div>
        <div class="btn share" onclick="openShare()">ZDIEĽAŤ</div>
      </div>
    </div>
    <div style="text-align:center;color:#666;font-size:13px;padding:10px;">
      Reálne streamy • Posledné voľby sa ukladajú
    </div>
  `;
}

function renderRadio() {
  return `
    <div class="globe-wrap">
      <div class="globe" id="globe"></div>
    </div>
    <div class="list">
      <div class="item active" onclick="playStation(stations.find(s=>s.id===current.id))">
        <div>
          <div class="name">${current.name}</div>
          <div class="info">${current.city} • ${current.genre}</div>
        </div>
        <div>▶</div>
      </div>
      <div style="text-align:center;color:#666;font-size:13px;margin-top:8px;">Ťukni na zelené bodky pre reálny stream</div>
    </div>
  `;
}

function placeDots() {
  const g = document.getElementById('globe');
  if (!g) return;
  g.innerHTML = '';
  const pos = [['32%','50%'],['28%','54%'],['38%','25%'],['42%','20%'],['30%','58%'],['36%','52%'],['34%','48%'],['40%','55%']];
  stations.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.top = pos[i % pos.length][0];
    d.style.left = pos[i % pos.length][1];
    d.title = s.name;
    d.onclick = () => playStation(s);
    g.appendChild(d);
  });
}

function renderLibrary() {
  let html = `<div class="section-title">ULOŽENÉ PIESNE</div><div class="list">`;
  savedSongs.forEach(s => {
    html += `<div class="item"><div><div class="name">${s.title}</div><div class="info">${s.artist} • ${s.album}</div></div></div>`;
  });
  html += `</div><div class="section-title">POSLEDNÉ STANICE</div><div class="list">`;
  const rec = recent.length ? recent : [current];
  rec.forEach(s => {
    html += `<div class="item" onclick="playStation(stations.find(x=>x.id===s.id)||current)"><div><div class="name">${s.name}</div><div class="info">${s.city} • ${s.genre}</div></div><div>▶</div></div>`;
  });
  html += `</div>`;
  return html;
}

function toggle() {
  if (playing) {
    audio.pause();
    playing = false;
    setStatus('○ STOP');
  } else {
    audio.play().then(() => { playing = true; setStatus('● LIVE'); }).catch(() => alert('Najprv vyber stanicu'));
  }
  show('player');
}
function next() { const i = stations.findIndex(s=>s.id===current.id); playStation(stations[(i+1)%stations.length]); }
function prev() { const i = stations.findIndex(s=>s.id===current.id); playStation(stations[(i-1+stations.length)%stations.length]); }

function openShare() {
  document.getElementById('shareText').textContent = `Práve hrá: ${current.name} (${current.city}) – ${current.freq}`;
  document.getElementById('shareModal').classList.add('show');
}
function closeShare() { document.getElementById('shareModal').classList.remove('show'); }
async function doShare(type) {
  const text = `Počúvam práve ${current.name} z ${current.city} na Winamp Radio!`;
  const url = location.href + '#s=' + current.id;
  if (type === 'native' && navigator.share) {
    try { await navigator.share({title:'Winamp Radio', text, url}); } catch(e) {}
  } else if (type === 'copy') {
    await navigator.clipboard.writeText(text + ' ' + url);
    alert('Odkaz skopírovaný!');
  } else if (type === 'whatsapp') {
    window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');
  }
  closeShare();
}

function initSpectrum() {
  const el = document.getElementById('spectrum');
  if (!el) return;
  el.innerHTML = '';
  for (let i = 0; i < 22; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    b.style.height = (Math.random()*28 + 8) + 'px';
    b.style.animationDelay = (i * 0.04) + 's';
    el.appendChild(b);
  }
}

// PWA install
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// Start
show('player');
</script>
</body>
</html>
